<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener with Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">URL Shortener with Analytics</h1>
        
        <!-- Input Section -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="longUrlInput" placeholder="Paste your long URL here (e.g., https://example.com)" class="flex-1 border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="shortenUrl()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 font-semibold">Shorten</button>
        </div>

        <!-- Result Box -->
        <div id="resultBox" class="hidden mb-6 p-4 bg-blue-50 border border-blue-200 rounded flex justify-between items-center">
            <div>
                <p class="text-sm text-gray-600 font-medium">Your Shortened URL:</p>
                <a id="shortLinkDisplay" href="#" target="_blank" class="text-blue-600 font-bold underline"></a>
            </div>
            <button onclick="copyToClipboard()" class="bg-gray-200 text-gray-700 px-4 py-1.5 rounded hover:bg-gray-300 text-sm font-medium">Copy</button>
        </div>

        <!-- Analytics Dashboard -->
        <div>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">Analytics Dashboard</h2>
                <button onclick="exportCSV()" class="bg-green-600 text-white px-4 py-1.5 rounded hover:bg-green-700 text-sm font-semibold">Export CSV</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700 text-sm">
                            <th class="p-3">Short URL</th>
                            <th class="p-3">Original URL</th>
                            <th class="p-3">Clicks</th>
                            <th class="p-3">Last Clicked</th>
                            <th class="p-3">Device</th>
                        </tr>
                    </thead>
                    <tbody id="analyticsTableBody" class="text-sm text-gray-600 divide-y divide-gray-200">
                        <!-- Data rows will populate here dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
